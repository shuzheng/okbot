<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>OkBot · 助手安装包</title>
<style>
  :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { margin: 0; padding: 32px; background: #0b1220; color: #e8eefc; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  h2 { margin: 0 0 12px; font-size: 16px; color: #9db0d4; }
  .muted { color: #9db0d4; margin-bottom: 20px; }
  .card { background: #141e33; border: 1px solid #243352; border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .card.ok { border-color: #2f6f4e; background: #10261c; }
  pre { margin: 0; white-space: pre-wrap; font-size: 13px; line-height: 1.45; color: #d7e3ff; }
  code { background: #243352; padding: 1px 6px; border-radius: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tag { display: inline-block; margin-top: 8px; padding: 4px 8px; border-radius: 999px; background: #243352; font-size: 12px; }
  ul { margin: 0; padding-left: 18px; color: #d7e3ff; }
</style>
</head>
<body>
<section>
  <h1>助手安装包</h1>
  <p class="muted">文件夹或 <code>.okbot</code> zip · 导出剥离密钥</p>
  <div class="grid">
    <div class="card">
      <h2>导出</h2>
      <ul>
        <li>avatar / name / persona</li>
        <li>AGENTS.md</li>
        <li>skills/*/SKILL.md</li>
      </ul>
      <p class="tag">不含 apiKey / token / session</p>
    </div>
    <div class="card">
      <h2>导入</h2>
      <ul>
        <li>新建助手</li>
        <li>恢复指令与技能</li>
        <li>onboarding 完成</li>
      </ul>
      <p class="tag">高级面板 · 默认折叠</p>
    </div>
  </div>
</section></body>
</html>
